<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Better Price Finder</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="pf-header">
      <svg class="pf-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 3h11a2 2 0 0 1 2 2v11l-9.5 6.5L3 13.5V5a2 2 0 0 1 2-2h3z" fill="#2F6844"/>
        <circle cx="9.5" cy="8" r="1.6" fill="#F5F6F3"/>
        <circle cx="17.5" cy="17" r="1.8" fill="#E8A33D"/>

      <h1>Better Price Finder</h1>

    <main id="content" class="pf-content">
      <p class="pf-muted">Checking this page&hellip;</p>

        <span class="pf-toggle-ui" aria-hidden="true"></span>
        <span class="pf-toggle-label">Search the same brand</span>
      </label>
      <span id="footer-note" class="pf-muted"></span>
    </footer>

    <script src="popup.js"></script>
